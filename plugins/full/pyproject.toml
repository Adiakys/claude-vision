[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-vision-full"
version = "0.7.0"
description = "claude-vision + local VLM captioning (SmolVLM) for token-efficient retrospective queries on long watch sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "andrea" }]
dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
wayland = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]
webcam = [
    "opencv-python-headless>=4.8",
]
picker = [
    # Fallback region picker for systems without tkinter (e.g., Debian/Ubuntu
    # without python3-tk). The bootstrap hook pulls this extra only when
    # tkinter is missing — on Fedora/Arch/macOS/Windows it stays unused.
    "pygame-ce>=2.5",
]
ml = [
    # Local image captioning for watch mode. ~750 MB first-run total download
    # (torch CPU wheel + transformers + SmolVLM-256M model).
    "transformers>=4.40",
    "torch>=2.1",
    "accelerate>=0.27",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
claude-vision = "claude_vision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_vision"]
