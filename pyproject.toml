[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-vision"
version = "0.3.0"
description = "Screen capture tool for Claude Code vision skill — cross-platform frame capture with pip-only dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "andrea" }]
dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
wayland = [
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4",
]
webcam = [
    "opencv-python-headless>=4.8",
]
picker = [
    # Fallback region picker for systems without tkinter (e.g., Debian/Ubuntu
    # without python3-tk). The bootstrap hook pulls this extra only when
    # tkinter is missing — on Fedora/Arch/macOS/Windows it stays unused.
    "pygame-ce>=2.5",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
claude-vision = "claude_vision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_vision"]
